name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - run: gradle :app:assembleDebug --no-daemon

      - run: cp app/build/outputs/apk/debug/app-debug.apk Timer25.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Timer25
          path: Timer25.apk

      # Publica em Releases para baixar direto no celular
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Timer25.apk --title "Timer 25" --notes "Build automático"
