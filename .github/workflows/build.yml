name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Exige a senha da chave
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Crie o Secret KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - run: |
          cp app/build/outputs/apk/release/app-release.apk TimerZap.apk
          echo $((GITHUB_RUN_NUMBER + 100)) > version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TimerZap
          path: TimerZap.apk

      # Publica em Releases: link fixo para baixar no celular + version.txt para o "Atualizar"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest TimerZap.apk version.txt --title "Timer Zap v1.$(cat version.txt)" --notes "Build automático"
